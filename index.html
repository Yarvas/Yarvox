<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarvox AI - Unlimited Awareness Assistant</title>
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #13131a;
            --bg-card: #1c1c24;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e2e3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: var(--accent-gradient);
            clip-path: polygon(0% 0%, 35% 0%, 50% 45%, 65% 0%, 100% 0%, 65% 55%, 65% 100%, 35% 100%, 35% 55%);
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(139, 92, 246, 0.3));
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: #ffffff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-status {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-top: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            height: 100%;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .network-pill {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .messages-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 85%;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user .msg-bubble {
            background: var(--accent-gradient);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .ai .msg-bubble {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .user .msg-meta {
            text-align: right;
        }

        .search-process {
            background: rgba(27, 27, 38, 0.6);
            border-left: 3px solid #3b82f6;
            padding: 10px 14px;
            border-radius: 4px 12px 12px 4px;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #60a5fa;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .process-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid transparent;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .input-area {
            padding: 16px 24px;
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .suggestion-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
        }

        .suggestion-chips::-webkit-scrollbar {
            height: 4px;
        }
        .suggestion-chips::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .chip {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .chip:hover {
            border-color: #3b82f6;
            color: var(--text-main);
        }

        .input-wrapper {
            display: flex;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 4px 8px;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color: #8b5cf6;
        }

        .chat-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 10px;
            font-size: 14px;
        }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            outline: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .highlight {
            color: #8b5cf6;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <div class="logo-icon"></div>
            <div class="logo-text">Yarvox</div>
        </div>

        <div class="system-status">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Yarvox Core Engine</span>
            </div>
            <div class="status-item" style="margin-top: 8px;">
                <span style="font-size: 11px; color: var(--text-muted);">Status: Ready for input</span>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Yarvox Console</h1>
            <div class="network-pill">Sandbox Live</div>
        </div>

        <div class="messages-box" id="messagesBox">
            <div class="message ai">
                <div class="msg-bubble">
                    Hello! I am <span class="highlight">Yarvox</span>. Type your question directly into the text box below or click one of the shortcut topics to test my analysis engine!
                </div>
                <div class="msg-meta">Yarvox Engine</div>
            </div>
        </div>

        <div class="input-area">
            <div class="suggestion-chips">
                <div class="chip" onclick="useSuggestion('Why are TikTok algorithms so hard to escape?')">TikTok Design</div>
                <div class="chip" onclick="useSuggestion('How does late-night screen scrolling mess up student focus?')">Sleep & Focus</div>
            </div>
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Type any custom question here..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="processUserQuery()">Query</button>
            </div>
        </div>
    </div>
